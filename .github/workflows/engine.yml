name: 위베이프 AI 조직 · 출근 시계
on:
  schedule:
    - cron: "0 11 * * 0"     # 일 20:00 KST 규제 감시자 + 트렌드 리서처
    - cron: "0 0 * * 1"      # 월 09:00 KST 편집장 기획 회의 → 기획안
    - cron: "30 0 * * *"     # 매일 09:30 KST 스탠드업
    - cron: "0 1 * * *"      # 매일 10:00 KST 작가 → 검수관
    - cron: "0 3 * * 2,4"    # 화·목 12:00 KST POP 디자이너 → 검수관
    - cron: "0 8 * * *"      # 매일 17:00 KST 업로드 기록원
    - cron: "30 8 * * 5"     # 금 17:30 KST 주간 발행 결과 + 편집장 결과 메모
    - cron: "*/10 * * * *"   # 10분마다 이벤트 폴링 (승인되면 즉시 다음 단계)
    - cron: "0 */6 * * *"    # 6시간마다 업계 독서가 (지식 카드)
    - cron: "0 2,14 * * *"   # 11:00·23:00 KST 관점 패널 자습
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 job 또는 task (예: monday_meeting, editor:plan, events:poll)"
        required: true
        default: "events:poll"
      page_id:
        description: "(company:score 전용) 노션 페이지 id"
        required: false
        default: ""
      score:
        description: "(company:score) 0~100"
        required: false
        default: ""
      decision:
        description: "(company:score) 승인|반려|유지"
        required: false
        default: ""
      memo:
        description: "(company:score) 관리자 메모 / (pop_make) 강제 재제작할 지점명"
        required: false
        default: ""
concurrency: { group: engine, cancel-in-progress: false }
permissions: { contents: write, pages: write, id-token: write }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_CONTENT_DB: ${{ secrets.NOTION_CONTENT_DB }}
      NOTION_STAFF_DB: ${{ secrets.NOTION_STAFF_DB }}
      NOTION_HQ_URL: ${{ secrets.NOTION_HQ_URL }}
      NOTION_MEMORY_DB: ${{ secrets.NOTION_MEMORY_DB }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INPUT_PAGE_ID: ${{ github.event.inputs.page_id }}
      INPUT_SCORE: ${{ github.event.inputs.score }}
      INPUT_DECISION: ${{ github.event.inputs.decision }}
      INPUT_MEMO: ${{ github.event.inputs.memo }}
      POP_FORCE_STORE: ${{ github.event.inputs.job == 'pop_make' && github.event.inputs.memo || '' }}
      KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 어떤 시계인지 결정
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "job=${{ github.event.inputs.job }}" >> $GITHUB_OUTPUT; exit 0; fi
          case "${{ github.event.schedule }}" in
            "0 11 * * 0") echo "job=sunday_reports" >> $GITHUB_OUTPUT;;
            "0 0 * * 1")  echo "job=monday_meeting" >> $GITHUB_OUTPUT;;
            "30 0 * * *") echo "job=daily_standup" >> $GITHUB_OUTPUT;;
            "0 1 * * *")  echo "job=daily_write" >> $GITHUB_OUTPUT;;
            "0 3 * * 2,4") echo "job=pop_make" >> $GITHUB_OUTPUT;;
            "0 8 * * *")  echo "job=daily_upload" >> $GITHUB_OUTPUT;;
            "30 8 * * 5") echo "job=friday_wrap" >> $GITHUB_OUTPUT;;
            "0 */6 * * *") echo "job=reader_shift" >> $GITHUB_OUTPUT;;
            "0 2,14 * * *") echo "job=panel_study" >> $GITHUB_OUTPUT;;
            *)            echo "job=poll_events" >> $GITHUB_OUTPUT;;
          esac
      - name: 출근
        run: node engine/run.js marketing ${{ steps.pick.outputs.job }}
      - name: 사무실 화면 배포 (GitHub Pages)
        if: always()
        run: |
          git config user.name "wevape-ai-engine"; git config user.email "engine@wevape.local"
          git add office/ || true
          git commit -m "office: ${{ steps.pick.outputs.job }} $(date -u +%FT%TZ)" || echo "변경 없음"
          git push || true
