<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위베이프 AI 조직 · 본사</title>
<style>
:root{--bg:#efe9dd;--ink:#1f2937;--muted:#6b7280;--line:#d9d2c5;--card:#fffdf8;--navy:#1e2a3a;--wood:#c9a97a;--wood2:#a8875a;
--ok:#2f855a;--wait:#dd6b20;--rej:#c53030;--pub:#2b6cb0;--draft:#9ca3af;--rev:#d69e2e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
a{color:inherit}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;position:sticky;top:0;z-index:9}
.top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
.crumb{display:flex;gap:6px;align-items:center;font-size:13px}
.crumb a{color:#fff;text-decoration:none;opacity:.7;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.crumb a.on{opacity:1;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08)}
.crumb i{opacity:.4;font-style:normal}
.top .sp{flex:1}
.top .clock{font-variant-numeric:tabular-nums;font-size:12px;opacity:.9;text-align:right;line-height:1.35}
.scene{display:none;max-width:1400px;margin:0 auto;padding:16px 18px 44px}
.scene.on{display:block}
.talkwrap{max-width:940px;margin:0 auto}
.talkwrap h2{font-size:22px;margin:8px 0 4px}
.talksub{color:var(--muted);font-size:13px;margin-bottom:18px}
.tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tpane{display:none}.tpane.on{display:block}
.rnd{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.say{display:flex;gap:11px;margin:0 0 14px;align-items:flex-start}
.say .av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.say .bd{flex:1;min-width:0}
.say .nm{font-size:13px;font-weight:800;margin-bottom:3px}
.say .tx{background:var(--card);border:1px solid var(--line);border-radius:3px 12px 12px 12px;padding:10px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.say.obj .tx{background:#fff5f5;border-color:#f3c5c5}
.say.agr .tx{background:#f2f9f4;border-color:#c9e6d3}
.tag2{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;margin-right:6px}
.tag2.o{background:#c53030;color:#fff}.tag2.a{background:#2f855a;color:#fff}.tag2.p{background:#6b46c1;color:#fff}
.ruling{background:#fffbe8;border:1px solid #e8d9a0;border-left:4px solid #d69e2e;border-radius:0 10px 10px 0;padding:16px 20px;margin:18px 0;font-size:14px;line-height:1.75;white-space:pre-wrap}
.ruling b{color:#8a6a12}
.confl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px;font-size:13.5px;line-height:1.65}
.confl .who{font-weight:800;color:#c53030}
.empty{color:var(--muted);padding:28px 0;text-align:center;font-size:14px}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--wait);color:#fff;font-size:11px;font-weight:800;text-align:center;vertical-align:middle}
.badge.zero{background:#cbd5e1}
.status{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;color:#fff;font-weight:700;vertical-align:middle}
.s-승인{background:var(--ok)}.s-승인대기{background:var(--wait)}.s-반려{background:var(--rej)}.s-발행{background:var(--pub)}.s-초안{background:var(--draft)}.s-검수중{background:var(--rev)}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 12px;border-radius:8px;border:0;cursor:pointer}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.sm{padding:4px 9px;font-size:11px}

/* ── 대표실 ── */
.ceo-room{position:relative;border-radius:18px;overflow:hidden;border:2px solid #b8a27a;background:linear-gradient(#f7f1e3 0 42%,#e7d6b6 42% 100%);min-height:560px;padding:18px}
.ceo-room:before{content:"";position:absolute;left:0;right:0;top:42%;height:6px;background:#a8875a;opacity:.5}
.ceo-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ceo-head h2{margin:0;font-size:20px}
.ceo-head small{color:var(--muted);font-size:12px}
.window{margin-left:auto;width:150px;height:74px;flex:none;border:6px solid #8b6f45;border-radius:6px;background:linear-gradient(#bfe0f5,#eaf6fb);box-shadow:inset 0 0 0 2px #fff}
.window:before,.window:after{content:"";position:absolute;background:#8b6f45}
.window:before{left:50%;top:0;bottom:0;width:4px;margin-left:-2px}.window:after{top:50%;left:0;right:0;height:4px;margin-top:-2px}
.ceo-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:16px;position:relative;margin-top:6px}
.desk{background:linear-gradient(#d8b98a,#c9a97a);border:2px solid var(--wood2);border-radius:14px;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.desk h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.tray{background:#fffdf8;border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:250px;box-shadow:inset 0 2px 8px rgba(0,0,0,.05)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.doc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--wait);border-radius:8px;padding:9px 10px;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.06);position:relative;transition:transform .15s}
.doc:hover{transform:translateY(-2px)}
.doc b{display:block;font-size:12.5px;line-height:1.35;margin-bottom:4px;padding-right:58px}
.doc .who{color:var(--muted);font-size:11px}
.doc .rev{margin-top:5px;font-size:11px;background:#fbf7ee;border-radius:6px;padding:4px 6px;color:#374151;max-height:56px;overflow:hidden}
.doc .act{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.doc.pop{border-left-color:#b83280}.doc.plan{border-left-color:#2f855a}.doc.report{border-left-color:#2b6cb0}
.stamp{position:absolute;right:8px;top:8px;font-size:10px;border:1.5px solid var(--wait);color:var(--wait);border-radius:4px;padding:1px 5px;transform:rotate(-8deg);font-weight:800;letter-spacing:.5px}
.empty{color:var(--muted);text-align:center;padding:60px 0;font-size:13px}
.score{display:flex;gap:4px;align-items:center;margin-top:7px;flex-wrap:wrap}
.score input[type=range]{flex:1;min-width:90px}
.score .v{font-weight:900;width:28px;text-align:right;font-variant-numeric:tabular-nums}
.score button{border:0;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:800;cursor:pointer;color:#fff}
.score .ok{background:var(--ok)}.score .rej{background:var(--rej)}.score .only{background:var(--navy)}
.score input[type=text]{flex:1 1 100%;font-size:11px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
.sent{font-size:11px;color:var(--ok);margin-top:4px}
.gear{cursor:pointer;font-size:12px;color:var(--muted);margin-left:auto}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px}
.card h3{margin:0 0 6px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.brief li{margin:3px 0}
.brief ul{margin:0;padding-left:16px}
.doorbtn{display:flex;align-items:center;gap:12px;background:#8b6f45;color:#fff;border-radius:12px;padding:12px 14px;text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 6px 14px rgba(0,0,0,.15);border:2px solid #6c5433}
.doorbtn .d{width:26px;height:40px;background:#c9a97a;border:2px solid #6c5433;border-radius:3px;position:relative}
.doorbtn .d:after{content:"";position:absolute;right:4px;top:18px;width:4px;height:4px;border-radius:50%;background:#f6d365}
.doorbtn small{display:block;font-weight:400;font-size:11px;opacity:.85}
.person{width:54px;text-align:center;font-size:10px;line-height:1.15;color:#374151;position:relative;transition:transform .8s}
.person svg{display:block;margin:0 auto 2px}
.person.away{opacity:.28}
.person .bub{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 7px;font-size:10px;box-shadow:0 2px 6px rgba(0,0,0,.08);opacity:0;transition:opacity .4s;pointer-events:none;max-width:200px;white-space:normal;width:max-content;z-index:3}
.person.talk .bub{opacity:1}
.person.walk svg{animation:bob .6s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.ceo-chair{position:absolute;left:50%;top:6px;transform:translateX(-50%)}
.gauge{display:flex;align-items:center;gap:14px}
.gauge .num{font-size:34px;font-weight:900;line-height:1}
.gauge .num small{font-size:13px;color:var(--muted);font-weight:600}
.bars{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:11px}
.bar{display:grid;grid-template-columns:52px 1fr 28px;gap:6px;align-items:center}
.bar i{display:block;height:8px;border-radius:4px;background:#e9e2d5;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--navy)}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}

/* ── 복도 ── */
.hall{position:relative;border-radius:18px;overflow:hidden;border:2px solid #b8a27a;background:linear-gradient(#f3ecdd 0 55%,#dcc9a6 55% 100%);min-height:520px;padding:18px}
.hall h2{margin:0 0 4px;font-size:20px}
.hall p.sub{margin:0 0 14px;color:var(--muted);font-size:12px}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-top:26px}
.door{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:inherit;display:block;transition:transform .15s,box-shadow .15s}
.door:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.door .frame{height:120px;border-radius:8px 8px 2px 2px;background:linear-gradient(#a8875a,#8b6f45);border:3px solid #6c5433;position:relative;margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
.door .frame:after{content:"";position:absolute;right:12px;top:56px;width:7px;height:7px;border-radius:50%;background:#f6d365;box-shadow:0 0 0 2px #6c5433}
.door .frame .plate{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#f6d365;color:#3b3b3b;font-size:11px;font-weight:800;padding:2px 8px;border-radius:3px;border:1px solid #b7791f;white-space:nowrap}
.door h3{margin:0 0 3px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.door .meta{font-size:11px;color:var(--muted);line-height:1.5}
.door.locked{opacity:.62;filter:grayscale(.3)}
.door.locked .frame{background:linear-gradient(#b8b0a2,#8f877a);border-color:#6b6357}
.door.locked .frame:after{background:#ddd}
.door .lock{position:absolute;right:10px;top:10px;font-size:14px}
.door .heads{display:flex;gap:2px;margin-top:6px}
.door .heads span{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}

/* ── 부서 방 (마케팅) ── */
.grid{display:grid;grid-template-columns:230px 1fr 250px;gap:14px;align-items:start}
.room{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;position:relative;min-height:96px;margin-bottom:12px;overflow:hidden}
.room h3{margin:0 0 6px;font-size:12px;letter-spacing:.2px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.room .desk2{height:8px;border-radius:4px;background:#e9e2d5;margin:4px 0 8px}
.people{display:flex;gap:10px;flex-wrap:wrap;min-height:58px;align-items:flex-end}
.out{font-size:11px;background:#fbf7ee;border-left:3px solid var(--line);padding:5px 8px;border-radius:6px;margin-top:6px;color:#374151}
.out b{display:block;font-size:11px;color:#111}
.center .room{min-height:150px}
.meet{min-height:210px}
.meet .table{margin:8px auto 4px;width:76%;height:44px;border-radius:50%;background:#e6dcc7;border:2px solid #d2c4a6;box-shadow:inset 0 3px 8px rgba(0,0,0,.06)}
.meet .seats{display:flex;justify-content:space-around;flex-wrap:wrap}
.meet .agenda{font-size:11px;color:#374151;margin-top:6px}
.meet .agenda li{margin:2px 0}
.factory{min-height:230px}
.belt{position:relative;height:120px;background:repeating-linear-gradient(90deg,#efe8da 0 24px,#e7dfcf 24px 48px);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.belt .bcard{position:absolute;top:14px;width:165px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.08);animation:slide var(--dur,40s) linear infinite;animation-delay:var(--delay,0s)}
.belt .bcard b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.belt .bcard small{color:var(--muted)}
@keyframes slide{from{left:100%}to{left:-190px}}
.flow{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin:8px 0 2px;flex-wrap:wrap}
.flow span{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.flow i{font-style:normal}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat small{font-size:10px;color:var(--muted)}
.popwall{min-height:150px}
.mem{min-height:120px}
.mem .shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 8px}
.mem .book{border-radius:6px;padding:6px 8px;color:#fff;text-align:center;font-size:11px}
.mem .book b{display:block;font-size:18px;line-height:1.1}
.mem .feed{font-size:11px;max-height:120px;overflow:auto}
.mem .feed div{padding:3px 0;border-bottom:1px dashed var(--line)}
.mem .feed .k{display:inline-block;font-size:10px;padding:0 6px;border-radius:999px;color:#fff;margin-right:4px}
.pops{display:flex;gap:10px;overflow-x:auto;padding:6px 2px}
.popthumb{flex:0 0 150px;text-decoration:none;color:inherit}
.popthumb .fr{width:150px;height:212px;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.1);position:relative}
.popthumb iframe{width:800px;height:1130px;transform:scale(.1875);transform-origin:0 0;border:0;pointer-events:none}
.popthumb small{display:block;font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.log h3{margin:0 0 8px;font-size:13px;color:var(--muted)}
.tl{display:grid;grid-template-columns:120px 26px 1fr;gap:6px 10px;font-size:12px;align-items:start;max-height:330px;overflow:auto}
.tl .t{color:var(--muted);font-variant-numeric:tabular-nums}
.tl .av{width:22px;height:22px;border-radius:50%;display:inline-block}
.tl .row{cursor:pointer;display:contents}
.tl .row:hover > div{background:#f7f2e8}
.trace{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;min-height:60px}
.trace .step{display:inline-block;background:#f3eee3;border-radius:6px;padding:3px 8px;margin:2px 4px 2px 0}
.trace .arrow{color:var(--muted);margin:0 2px}
.sched{display:grid;grid-template-columns:70px 1fr;gap:4px 8px;font-size:11px}
.sched .w{color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.foot{font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:1000px){.grid,.ceo-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.window{display:none}}
</style></head><body>
<div class="top">
  <h1>🏢 위베이프 AI 조직 · 본사</h1>
  <nav class="crumb"><a href="#ceo" data-s="ceo">👤 대표실</a><i>›</i><a href="#hall" data-s="hall">🚪 복도</a><i>›</i><a href="#marketing" data-s="marketing" id="crumb-dept">📣 마케팅 방</a><i>·</i><a href="#talk" data-s="talk">🗣️ 회의록</a></nav>
  <span class="sp"></span>
  <div class="clock"><div id="now"></div><div id="next"></div></div>
</div>

<section class="scene" id="s-ceo"></section>
<section class="scene" id="s-hall"></section>
<section class="scene" id="s-talk"></section>
<section class="scene" id="s-marketing">
<div class="grid">
  <div class="left" id="left"></div>
  <div class="center">
    <div class="room meet" id="meet"></div>
    <div class="room factory" id="factory"></div>
    <div class="room popwall" id="popwall"></div>
    <div class="room mem" id="mem"></div>
  </div>
  <div class="right">
    <div class="room ceo" id="ceo"></div>
    <div class="room" id="editor"></div>
    <div class="room" id="sched"></div>
  </div>
</div>
<div class="log">
  <h3>🕓 활동 로그 — 누가, 언제, 무엇을 (클릭하면 처리 과정 추적)</h3>
  <div class="tl" id="tl"></div>
  <div class="trace" id="trace">항목을 클릭하면 「누가 무엇을 근거로 만들었고 → 누가 검수했고 → 관리자가 어떻게 처리했는지」가 표시됩니다.</div>
  <div class="foot">스냅샷 생성: <span id="gen"></span> · 데이터 원본: 노션 「위베이프 마케팅 AI 조직」 콘텐츠·보고 DB · 이 화면은 출근 시계가 돌 때마다 다시 생성됩니다.</div>
</div>

", "to": "쇼츠 트렌드 리서처", "what": "연수점 — '처음 와도 상담 가능' 구조", "why": "기준서 D항목 '입문, 처음 시작, 초보자용' 금지를 위반할 소지가 있습니다. '처음 와도'는 초행 고객 응대를 뜻하지만 '처음 시작'으로 읽힐 위험이 있습니다. 헌장 3조에 따라 확인하지 않은 것을 확인한 것처럼 쓰지 않습니다.", "instead": "'처음 오셔도 편하게 상담 가능합니다' 대신 '이미 사용 중이신 성인 고객께 자세히 안내합니다'(기준서 치환표 기준)로 바꾸거나, '처음 오셔도'를 삭제하고 '매장 방문 시 상담 가능합니다'로 쓰세요."}, {"from": "규제 검수관", "to": "블로그 작가", "what": "논현점 — 1층 접근성 + 처음 오는 고객 응대 / 첫 문장: 1층이라 들어가기 편함 / 넣을 것: 초행 고객 상담 가능", "why": "D항목 '입문, 처음 시작, 초보자용' 금지 위반 가능성. '초행 고객'은 비흡연자 유인으로 읽힐 수 있습"}], "ruling": "# 기획 회의록 2026-W38\n\n**일시**: 2026-09-09 (월)  \n**의장**: 주간 마케팅 편집장  \n**회의 방식**: 2라운드 (1라운드 의견 → 2라운드 반박·동의 → 의장 판정)\n\n---\n\n## 참석\n\n- 규제 감시자\n- 쇼츠 트렌드 리서처\n- 블로그 작가\n- 규제 검수관\n\n---\n\n## 1라운드 요지\n\n**규제 감시자**: 시점 언급(\"4월 이전\") 금지, 매장 내부 사진(진열대·가격표) 전면 금지, 무니코틴 표현 일체 금지. 준법 문장 \"정식 담배소매인 지정 매장, 성인 인증 철저\" 권장.\n\n**쇼츠 트렌드 리서처**: 연수점 \"처음 와도 상담 가능\", 구월로데오점 \"주차+대중교통\", 공항점 \"법 준수 매장 신뢰\" 3개 소재 제안. 사진은 매장 내부 응대 장면(진열대 흐림 처리).\n\n**블로그 작가**: 9지점 표 형식 기획안 1안 제출. 첫 문장에 고객 결정 요소(상담·응대·주차) 배치 규칙 제안. 10개 자체 점검 항목 제시.\n\n**규제 검수관**: 감시단 60명+신고센터 운영 중 → 보수 강화. \"4월 이전\" \"처음\" \"무니코틴\" 자동 반려. 직원 계정 고정 멘트 필수.\n\n---\n\n## 충돌한 지점 — 8건\n\n### 1. 연수점 \"처음 오셔도 편하게 상담 가능\" 표현 (쇼츠 트렌드 리서처 vs 규제 감시자·규제 검수관)\n\n**누가 무엇을 반대했나**:  \n규제 감시자·규제 검수관이 쇼츠 트렌드 리서처의 \"처음 오셔도 편하게 상담 가능합니다\" 표현을 반대. 기준서 D항목 '입문, 처음 시작, 초보자용' 금지 위반 소지. 감시단 60명 운영 중이므로 회색지대 표현 전부 반려. 대안: '이미 사용 중이신 성인 고객께 자세히 안내' 또는 '매장 방문 시 상담 가능'으로 변경.\n\n**판정**: **규제 감시자·규제 검수관 의견 채택**  \n**이유**: **규제 > 브랜드** 기준. 기준서 D항목은 '입문, 처음 시작, 초보자용'을 명시 금지하며, 치환표에서도 \"처음 시작하시는 분도 편하게\" → \"이미 사용 중이신 성인 고객께 자세히 안내\"로 대체를 권고했다. '처음 오셔도'는 초행 고객 응대 의도지만, **신고센터 8월 1일 운영 중이라는 W37 이슈4 배경에서 오인 가능성을 배제할 수 없다.** 헌장 3조 \"확인하지 않은 것을 확인한 것처럼 쓰지 않는다\" 원칙에 따라, 회색지대는 반려가 기본값이다.\n\n**확정 표현**: \"이미 사용 중이신 성인 고객께 매장에서 자세히 안내합니다\" 또는 \"매장 방문 시 상담 가능합니다\"\n\n---\n\n### 2. 논현점 \"처음 오는 고객 응대\" 주제와 \"초행 고객 상담 가능\" 표현 (블로그 작가 vs 규제 감시자·규제 검수관)\n\n**누가 무엇을 반대했나**:  \n규제 감시자·규제 검수관이 블로그 작가의 논현점 주제 \"처음 오는 고객 응대\" 및 \"초행 고객 상담 가능\"을 반대. D항목 '입문, 처음 시작' 위반 소지 반복. 1층 접근성은 안전하나 '처음' 단어가 비흡연자 유인으로 읽힐 수 있음. 대안: 주제를 '1층 접근성 + 방문 편의성'으로, 첫 문장을 '1층이라 건물 찾기 쉬움'으로 변경.\n\n**판정**: **규제 감시자·규제 검수관 의견 채택**  \n**이유**: **규제 > 브랜드** 기준. 충돌 1번과 동일한 맥락. '처음 오는', '초행 고객'은 의도는 순수하지만, 기준서 D항목이 '입문·처음 시작'을 명시 금지한 이유는 **비흡연자 유인으로 읽힐 가능성** 때문이다. 감시단 60명+신고센터 운영 중이라는 W37 이슈를 고려하면, 신고 리스크를 감수할 이유가 없다. 1층 접근성은 강점이므로 그것만 강조하면 충분하다.\n\n**확정 주제**: \"논현점 — 1층 접근성 + 건물 찾기 쉬운 위치\"  \n**확정 첫 문장 결정 요소**: \"1층이라 건물 찾기 쉬움\"\n\n---\n\n### 3. 연수점 \"퇴근길 흡연 미화\" 금지 표현 범위 (블로그 작가 vs 규제 감시자)\n\n**누가 무엇을 반대했나**:  \n규제 감시자가 블로그 작가의 연수점 표 \"넣지 말 것: 퇴근길 흡연 미화·제품 재고 종류\"에 대해 반대. 기준서 G(흡연 미화) 위반은 맞으나, '퇴근 후 방문'이라는 주제 자체가 G 위반은 아님. '하루의 마무리' 류 표현이 들어가면 위반. 지금 표에서는 각도 설명이 '평일 저녁 7~9시 직장인 고객층'이므로 시간대·고객층 서술은 안전. 대안: '퇴근 후 한 모금', '하루 마무리' 류 표현만 금지.\n\n**판정**: **규제 감시자 의견 채택**  \n**이유**: **규제 기준 명확화**. 기준서 G항목은 \"멋있다, 폼 난다, 감성, 무드, 분위기 있게\" 및 \"'하루의 마무리', '퇴근 후 한 모금' 류 생활 미화\"를 금지한다. 그러나 **'평일 저녁 7~9시 직장인 고객층'이라는 시간대·고객층 서술은 사실 정보**이며 미화가 아니다. 블로그 작가가 \"넣지 말 것\"에 '퇴근길 흡연 미화'라고 쓴 것은 올바르지만, 이것이 '퇴근 후 방문' 주제 자체를 금지하는 것으로 오해되지 않도록 **경계를 명확히** 해야 한다.\n\n**확정 금지 표현**: \"퇴근 후 한 모금\", \"하루의 마무리\", \"평일 저녁 감성\" (×)  \n**허용 표현**: \"평일 저녁 7~9시 방문 집중 시간대\", \"직장인 고객 응대\" (○)\n\n---\n\n### 4. 공항점 \"신고센터 운영 배경\" 언급 방식 (쇼츠 트렌드 리서처 vs 블로그 작가)\n\n**누가 무엇을 반대했나**:  \n블로그 작가가 쇼츠 트렌드 리서처의 \"W37 이슈4(신고센터 8월 1일 운영) 배경으로 '정식 담배소매인 지정 매장' 신뢰 강조\" 제안을 반대. 신고센터 운영을 글 배경으로 쓰면 \"우리를 조심하세요\"로 읽힘. 신뢰 요소는 맞지만 신고센터를 직접 언급하지 말고 \"정식 담배소매인 지정 매장\"만 자연스럽게. 대안: 신고센터는 기획 배경에만 남기고 글에 안 보이게.\n\n**판정**: **블로그 작가 의견 채택**  \n**이유**: **브랜드 > 근거 있는 의견** 기준. 신고센터 운영은 **우리의 기획 근거**이지, 독자에게 보여줄 정보가 아니다. 블로그에 \"8월 1일부터 신고센터가 운영되어 우리는 법 준수 매장입니다\"라고 쓰면, 독자는 \"왜 갑자기 방어적으로 나오지?\"라는 의심을 갖는다. 신뢰는 **자연스럽게 드러나는 사실**로 형성되며, 규제 이슈를 직접 언급하는 것은 오히려 역효과다. 관리자 교훈 \"낮은 품질 인정하고 개선 방향 제시\"에서도, 문제를 드러내는 것과 독자에게 보여주는 것은 다르다.\n\n**확정 구조**: 공항점 글은 \"정식 담배소매인 지정 매장 / 성인 인증 철저 / 본사 대표 직영점 / 외국인 고객 중국어 안내\"만 담고, 신고센터는 기획 회의록에만 기록.\n\n---\n\n### 5. 사진 형식 \"매장 내부 응대 장면(진열대 흐림 처리)\" (쇼츠 트렌드 리서처 vs 블로그 작가)\n\n**누가 무엇을 반대했나**:  \n블로그 작가가 쇼츠 트렌드 리서처의 \"매장 내부 응대 장면(진열대 흐림 처리)\" 제안을 반대. 규제 감시자가 \"매장 내부 사진 중 진열대·가격표·제품 패키지 읽히는 것 전면 금지\"라고 명시. 흐림 처리해도 진열대가 프레임 안에 있으면 J 위반 소지. 대안: 카운터 너머 직원 상반신만, 진열대는 아예 프레임 밖으로.\n\n**판정**: **블로그 작가 의견 채택**  \n**이유**: **규제 > 브랜드** 기준. W37 이슈2 \"8월 현재도 지자체 담배소매점 불법 광고 단속 지속\"이 확정되었고, 기준서 J 카테고리는 \"매장 내부 사진 — 진열대에 제품명이 읽히면 J 위반. 흐림 처리 또는 각도 조정\"이라고 명시한다. 그러나 **감시단 60명+신고센터 운영 중이라는 W37 이슈4를 고려하면**, 흐림 처리로 충분한지 확신할 수 없다. 헌장 3조 \"확인하지 않은 것을 확인한 것처럼 쓰지 않는다\" 원칙에 따라, **진열대는 아예 프레임 밖으로 빼는 것이 안전선**이다.\n\n**확정 지시**: \"카운터 너머 직원 응대 장면(상반신만) — 진열대는 프레임 밖, 배경은 매장 천장·간판·입구만\" 또는 \"매장 외관·주차 공간·찾아오는 길 동선 사진\"\n\n---\n\n### 6. 규제 감시자의 \"첫 문장 배치 규칙\" 제안 (규제 감시자 vs 규제 검수관)\n\n**누가 무엇을 반대했나**:  \n규제 검수관이 규제 감시자의 \"블로그 글 첫 문장에 제품·맛·"}}, "pending": [{"id": "3cd09730-b906-81ac-a850-edf25b1f832e", "title": "주간 기획안 2026-W37", "line": "기획", "type": "기획안", "author": "주간 마케팅 편집장", "stores": ["공통"], "week": "2026-W37", "t": "2026-08-31T02:24:00.000Z", "url": "https://app.notion.com/p/2026-W37-3cd09730b90681aca850edf25b1f832e", "basis": "기획 회의록 2026-W37 / 이슈 브리핑 / 트렌드 보고", "review": "", "memo": "", "body": "주간 기획안 2026-W37\n**제출**: 2026-08-30 (월)  \n**편집장**: 주간 마케팅 편집장 (AI)  \n**대상 지점**: 인천·부천 9개 지점 (연수·논현·구월길병원·구월로데오·공항·검단·계산·신중동·상동)  \n**기획 근거**: 규제 감시자 W37 브리핑 / 쇼츠 트렌드 리서처 W37 보고 / 업로드 기록원 W36 결과 / 관점 패널 기획 회의 (08-30)\n0. 지난 기획안(W36) 반려 사유 반영\n**W36 승인 점수**: 50점  \n**대표 지적**: \"더 상업적으로 사용할 수 있는 기준들을 더 면밀하게\"\n**이번 주 반영 사항**:\n**제목 상업성 강화** — 정보 나열('주차·응대 먼저') → 고객 pain point 해결('헛걸음 없는 이유')로 전환\n**각도 차별화 3축** — 시간대별(삭제) → ①고객군별(병원·주택가·신도시) / ②방문 장벽 해결(주차·거리·재고) / ③법 준수 신뢰(성인 인증·본사 직영)\n**재고 안정성 메시지 표준화** — 관리자 표준 문구(\"찾는 것 없어 헛걸음하는 일이 적다\") 전 지점 적용\n**사진 지점별 차별화** — 간판 동일 형식 폐기 → 교통·입지·공간 특성별 9가지 각도 (충돌 8번 판정)\n1. 이번 주 공통 방침\n핵심 전략: 상업성 = 고객 결정 순간 해결\nW36 대표 지적 \"더 상업적으로\"를 다음 3가지로 구체화했다:\n**제목부터 고객 결정 요소** — \"무엇을 파는가\"가 아니라 \"왜 이 매장을 가야 하는가\" (충돌 1번 판정)\n**각도는 방문 장벽 제거** — 멀지 않다(교통) / 없어서 못 사는 일 없다(재고) / 속지 않는다(정품·본사 직영)\n**첫 문장에 결정 이유 1개** — 상담·주차·신뢰·접근성 중 하나로 시작, 제품명·향·가격은 기준서 A 참조 (충돌 6번 판정)\n**근거**:\n규제 감시자 브리핑: \"신고센터 8월 1일 운영, 감시단 60명 활동 중 → 회색지대 보수 처리\"\n쇼츠 트렌드 보고: \"트렌드 5쌍(친근함·신뢰·편의성·정보·스토리 vs 추상·장황·반복·중복·과장) → 블로그는 편의성·정보 우선\"\n업로드 기록원 W36 결과: \"발행 0건, 평균 점수 35~49점, 반복 지적 '지점별 내용 중복'\"\n관점 패널 회의: \"첫 문장 규칙(소설 보는 사람), 사진 차별화(영화 보는 사람), 제목 pain point(시 읽는 사람) 채택\"\n법 준수 신뢰 강화 주간\n감시단 60명 운영 + 신고센터 가동 환경에서는 **\"우리가 법을 지키는 매장\"** 이미지가 곧 상업적 가치다.\n성인 인증 철저 → 청소년 판매 금지 준수 → 안심하고 살 수 있는 매장\n본사 직영 → 정품·정식 유통 → 가짜 걱정 없음\n재고 안정 → 본사 실시간 관리 → 헛걸음 없음\n이번 주 9지점 각도는 **법 준수 신뢰**를 상업성의 뼈대로 삼는다.\n2. 이번 주 금지·주의 표현\n**규제 감시자 브리핑 근거** (2026-08-30):\n신고센터 8월 1일 운영 중 → 제품 광고로 읽히는 즉시 신고 위험\n감시단 60명 활동 중 → 회색지대도 보수 처리\n**기준서 재확인 필수 항목** (충돌 2·3·5·7·11번 판정):\n| 금지 표현 | 근거 | 이번 주 적용 |\n|---|---|---|\n| **시간대 생활 밀착 표현** | 기준서 G (흡연 미화), 교훈 2026-08-28 \"저녁 시간대·가로등·퇴근길 자체 점검\" | '퇴근 시간대', '점심시간 짧게', '하루 마무리' 전면 금지 / '저녁 8시까지 영업'은 사실 기재로 허용 (충돌 7번 절충안) |\n| **편의성 뉘앙스 표현** | 기준서 C (건강·안전), G (미화) | '편하게 들르는', '부담 없이', '빠르게' 금지 / '처음 오셔도 설명해드립니다'는 허용 (기준서 3 안전 영역) |\n| **제품 광고 요소 첫 문장 배치** | 기준서 A, 충돌 6번 | 첫 문장은 고객 결정 요소(상담·주차·신뢰)로 시작 / 제품명·향·가격은 기준서 A 참조 |\n| **매장 내부 사진** | 기준서 J, 규제 감시자 브리핑 ②번 | 진열대 클로즈업 금지 / 공간 사진은 제품·가격표 미노출 확인 후 제출 (충돌 8번 판정) |\n| **재고 상태 구체 수치** | 기준서 A, 충돌 10번 보류 | 관리자 표준 문구(\"찾는 것 없어 헛걸음하는 일이 적다\") 허용 / '재고 300종', '품절 없음' 금지 |\n**규제 검수관 자동 반려 단어**: 퇴근길, 퇴근 시간대, 점심시간 짧게, 편하게 들르는, 무드, 분위기 있게, 감성\n**무니코틴 관련**: 충돌 9번 판정 — 관리자 결정(취급 예정 없음)으로 다루지 않음. 별도 금지 항목 추가 없음.\n3. 지점별 기획 카드 9장\n- [1순위] 연수 | 재고 안정성 | 송도에서 찾는 것 없어 헛걸음 없는 이유 — 본사 직영 실시간 관리 | 리뷰형 | 대중교통 사진·본사 직영·재고 안정 표준 문구·영업시간 | 퇴근 시간대·오후 6~8시·시간대 특정 표현\n- [1순위] 논현 | 주택가 단골 신뢰 | 논현동 주택가에서 정품 확인하고 사는 매장 — 본사 직영점 | 후기형 | 주택가 골목 사진·정품 안내·처음 오셔도 설명·직원 신뢰형 멘트 | 편하게 들르는·동네 친구·아늑한 분위기\n- [2순위] 구월길병원 | 병원 근처 접근성 | 길병원 근처 성인 인증 철저한 매장 — 점심시간에도 영업 | 리뷰형 | 병원 방향 안내 사진·성인 인증 철저·법 준수 신뢰·영업시간 | 점심시간 짧게·빠르게·편의성 뉘앙스\n- [1순위] 구월로데오 | 상권 핵심 입지 | 구월로데오 1층 — 찾기 쉬운 위치에 본사 직영 | 리뷰형 | 1층 간판 사진·찾아오는 길·주차 안내·본사 직영 | 유흥가·번화가·밤 늦게·시간대 표현\n- [2순위] 공항 | 공항철도 접근성 | 인천공항철도역 5분 거리 — 출장·여행 전 들르기 좋은 매장 | 리뷰형 | 공항철도역 방향 사진·대중교통·영업시간·재고 안정 | 출 를 일체 쓰지 않고**, \"정식 담배소매인 지정 매장 / 본사 대표 직영점 / 성인 인증 철저 / 재고 안정성·응대·위치 편의성\"만 담는다. 회색지대 표현(\"처음 오셔도\", \"무니코틴\", \"4월 이전\")은 전부 반려한다.\n근거\n규제 감시자 W37 이슈 브리핑 4건 (신고센터·단속 지속·시점 언급·가격표)\n교훈 \"자료함 확인 후 제출 필수\" (2026-09-06 대표 자료 80점 기준 재확인)\n교훈 \"편집장 판정 모순→즉시 검증회의\" (W38 회의에서 충돌 8건 조정 완료)\n2. 금지·주의 표현 (이번 주 강조)\n전면 금지 (A~J 카테고리 — 기준서 v0.2)\n**A**: 제품명·브랜드·니코틴 함량·가격·입고·재입고·신제품·품절·재고 수량·용량·퍼프 수·사용 후기·비교\n**B**: 맛·향 일체 (과일·디저트·음료명·감각 형용사·향 이미지)\n**C**: 건강·안전 관련 (덜 해롭다·금연 보조·스트레스 해소)\n**D**: 비흡연자·여성·청소년 유인 (입문·처음 시작·초보자용·학생·귀엽다·선물)\n**E**: 판촉 (할인·세일·1+1·사은품·쿠폰·이벤트)\n**F**: 온라인 판매 유도 (카톡 주문·배송·예약 구매)\n**G**: 흡연 미화 (멋있다·감성·무드·\"하루의 마무리\"·\"퇴근 후 한 모금\")\n**H**: 근거 없는 최상급 (최다·최대·1위·유일) — \"일회용 제품 취급 폭이 넓은 편\"으로 대체\n**I**: 후기 위장 (직원 계정 글에 \"본사 직영팀이 직접 작성\" 표기 필수)\n**J**: 이미지 (제품 패키지·액상·인물·흡연 장면·진열대 클로즈업)\n이번 주 특별 주의 (W37 이슈 반영)\n**\"처음 오셔도\" \"초행 고객\" 표현 금지** — D항목 위반, 신고센터 운영 중이므로 회색지대 반려 강화. → \"이미 사용 중이신 성인 고객께\" 또는 \"매장 방문 시\"로 대체\n**\"4월 이전\" 시점 언급 금지** — 합성니코틴이 담배가 아니었던 시기로 오인 가능\n**무니코틴 표현 일체 금지** — 위베이프는 무니코틴 제품 미취급, 오인 방지\n**매장 내부 사진 — 진열대는 프레임 밖** — 흐림 처리 불충분, 카운터 너머 직원 상반신만 또는 매장 외관·주차·동선 사진\n**\"퇴근 후 한 모금\" \"하루의 마무리\" 금지** — G항목 위반. 단, \"평일 저녁 7~9시 직장인 고객 응대\"는 사실 정보이므로 허용\n3. 지점 카드 9장 (한 줄 형식 — 파싱용)\n[1] 연수 | 송도 국제업무단지 인근 성인 고객 응대·성인 인증 철저 | 매장 위치와 준법 신뢰 강조 | 리뷰형 | 송도 국제업무단지 도보 5분·성인 고객 응대·성인 인증 철저·정식 담배소매인 지정 매장·본사 직영점 | 제품명·맛·향·가격·재고 종류·\"처음 오셔도\"·청소년 연상 표현\n[2] 논현 | 1층 접근성·건물 찾기 쉬운 위치 | 건물 1층이라 찾기 편함·주차 가능 | 리뷰형 | 건물 1층·주소·전화·영업시간·주차 가능·대중교통 안내·본사 직영점 | 제품명·맛·향·가격·\"처음 오는\"·\"초행 고객\"·진열대 사진\n[3] 구월길병원 | 길병원 인근 재고 안정성·본사 직영점 신뢰 | 의료 시설 인근 고객 응대·재고 안정 강조 | 후기형 | 길병원 도보 거리·재고 안정·본사 직영점·정식 담배소매인 지정 매장·성인 인증 철저 | 제품명·맛·향·가격·재고 수량·할인·\"처음\"\n[4] 구월로데오 | 로데오거리 접근성·주차+대중교통 편의 | 상권 중심부 위치·주차·버스 정류장 인근 | 리뷰형 | 로데오거리 중심부·주차 공간·버스 정류장 도보 1분·본사 직영점·영업시간 | 제품명·맛·향·가격·진열대 사진·\"처음\"·할인\n[5] 공항 | 인천공항 인근 정식 담배소매인 지정 매장·외국인 고객 중국어 안내 | 준법 신뢰·외국인 응대 강조 | 리뷰형 | 정식 담배소매인 지정 매장·성인 인증 철저·본사 직영점·중국어 안내 가능·공항 접근성 | 제품명·맛·향·가격·신고센터 직접 언급·해외 배송·대리구매\n[6] 검단 | 검단신도시 재고 안정성·본사 직영점 | 신도시 고객 응대· /* ─────────── 대표실 채점·결재 → GitHub Actions → 노션 ─────────── */
function setToken(){ const t=prompt("GitHub 토큰(fine-grained, 이 리포 Actions: Read and write)을 붙여넣으세요. 이 브라우저에만 저장됩니다.", localStorage.getItem("wv_gh_token")||""); if(t!==null){ localStorage.setItem("wv_gh_token", t.trim()); alert(t.trim()?"저장됐습니다. 이제 결재함에서 바로 점수·승인·반려가 됩니다.":"토큰을 지웠습니다."); } }
async function sendOrder(btn){
  const ta=document.getElementById('ceo-order'); const out=btn.parentElement.querySelector('.so-out');
  const memo=(ta.value||'').trim(); if(!memo){ out.textContent='지시 내용을 적어주세요.'; return; }
  const tok=localStorage.getItem('wv_gh_token'); if(!tok){ out.textContent='먼저 결재함의 ⚙ 결재 연결에서 토큰을 넣어주세요.'; return; }
  btn.disabled=true; out.textContent='전달 중…';
  try{
    const r=await fetch(`https://api.github.com/repos/${D.repo}/actions/workflows/engine.yml/dispatches`,{method:'POST',headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({ref:'main',inputs:{job:'ceo:instruct',memo:memo.slice(0,900)}})});
    if(r.status===204){ out.textContent='전달됐습니다 — 편집장이 1~3분 안에 접수해 실행합니다.'; ta.value=''; }
    else{ out.textContent='실패('+r.status+') — ⚙ 결재 연결의 토큰 권한을 확인해주세요.'; }
  }catch(e){ out.textContent='오류: '+e.message; }
  btn.disabled=false;
}
async function sendScore(btn, decision){
  const box=btn.closest('.score'); const id=box.dataset.id; const score=box.querySelector('input[type=range]').value; const memo=box.querySelector('input[type=text]').value; const out=box.nextElementSibling;
  const tok=localStorage.getItem("wv_gh_token"); if(!tok){ out.textContent="먼저 ⚙ 결재 연결에서 토큰을 넣어주세요."; return; }
  if(!D.repo){ out.textContent="repo 설정 없음(department.json github_repo)"; return; }
  if(!id){ out.textContent="페이지 id 없음 — 다음 갱신 후 다시"; return; }
  out.textContent="전송 중…";
  try{
    const r=await fetch(`https://api.github.com/repos/${D.repo}/actions/workflows/engine.yml/dispatches`,{method:"POST",headers:{"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({ref:"main",inputs:{job:"company:score",page_id:id,score:String(score),decision,memo}})});
    if(r.status===204){ out.textContent=`✔ ${decision} · ${score}점 전송됨 — 1~2분 내 노션 반영, 카드는 다음 갱신 때 사라집니다.`; btn.closest('.doc').style.opacity=.5; }
    else { out.textContent=`실패 ${r.status}: 토큰 권한(Actions: write) 또는 리포 이름 확인`; }
  }catch(e){ out.textContent="실패: "+e.message; }
}
/* ─────────── 장면 전환 + 시계 + 애니메이션 ─────────── */
function show(){
  let s = (location.hash||"#ceo").slice(1); if(!document.getElementById('s-'+s)) s="ceo";
  document.querySelectorAll('.scene').forEach(e=>e.classList.toggle('on', e.id==='s-'+s));
  document.querySelectorAll('.crumb a').forEach(a=>a.classList.toggle('on', a.dataset.s===s));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', show); show();
document.getElementById('gen').textContent = D.generated_at;
function tick(){
  const now = new Date();
  const kst = new Date(now.getTime() + (9*60 + now.getTimezoneOffset())*60000);
  document.getElementById('now').textContent = `KST ${kst.toLocaleString('ko-KR',{hour12:false})} · ${D.week}`;
  const nx = new Date(D.next_shift.at); const diff = Math.max(0, nx - now);
  const h = Math.floor(diff/3600000), mm = Math.floor(diff%3600000/60000);
  document.getElementById('next').textContent = `다음 출근: ${D.next_shift.label} · ${h}시간 ${mm}분 후`;
}
tick(); setInterval(tick, 30000);
const persons = [...document.querySelectorAll('#s-marketing .person:not(.away)')];
let k=0;
setInterval(()=>{ persons.forEach(p=>p.classList.remove('talk','walk')); const p = persons[k%persons.length]; if(p){ p.classList.add(p.querySelector('.bub')?'talk':'walk'); } k++; }, 1800);
const seatEls = [...document.querySelectorAll('#meet .person')];
let oi=0; setInterval(()=>{ if(!m.opinions.length) return; seatEls.forEach(e=>{e.classList.remove('talk'); const b=e.querySelector('.bub'); if(b) b.remove();}); const op = m.opinions[oi%m.opinions.length]; const el = seatEls.find(e=>e.dataset.id===op.who); if(el){ el.insertAdjacentHTML('beforeend',`<div class="bub">${esc(op.text)}</div>`); el.classList.add('talk'); } oi++; }, 3200);
