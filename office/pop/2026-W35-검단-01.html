<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>[검단] 매장 위치 안내 POP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
<style>@page{size:A4 portrait;margin:0}html,body{margin:0;background:#e5e7eb}
.pop{width:210mm;height:297mm;margin:0 auto;position:relative;overflow:hidden;background:#5b1fd6;font-family:'Noto Sans KR',sans-serif;color:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(14mm)}
.orb{position:absolute;border-radius:50%;filter:blur(.3mm);box-shadow:0 0 6mm rgba(255,255,255,.4)}
.arrow,.squig{position:absolute}
.half{position:absolute;left:-10%;bottom:-18%;width:120%;height:52%;border-radius:50% 50% 0 0}
.star{position:absolute;font-size:12mm}
.heart{position:absolute;background:radial-gradient(circle at 30% 30%,#fff 0%,#ffd6f5 25%,#c9b6ff 55%,#bfe4ff 100%);clip-path:path('M50 90 L15 55 A20 20 0 1 1 50 25 A20 20 0 1 1 85 55 Z');opacity:.9}
.heart{clip-path:polygon(50% 100%,10% 55%,10% 30%,30% 12%,50% 25%,70% 12%,90% 30%,90% 55%);border-radius:50%}
.ring{position:absolute;left:8%;top:34%;width:84%;height:38%;border:.5mm solid rgba(255,255,255,.85);border-radius:50%;transform:rotate(-14deg)}
.spark{position:absolute;color:#fff;font-size:14mm;text-shadow:0 0 3mm rgba(255,255,255,.7)}.spark.small{font-size:8mm}
.wm{position:absolute;left:-40%;top:46%;width:180%;text-align:center;font-family:'Playfair Display',serif;font-size:14mm;color:rgba(255,255,255,.28);transform:rotate(-24deg);white-space:nowrap;letter-spacing:1mm}
.snow{position:absolute;color:#fff;font-size:22mm;text-shadow:0 0 2mm rgba(120,160,220,.5)}
.balloon{position:absolute;width:11mm;height:14mm;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;box-shadow:inset -2mm -2mm 4mm rgba(0,0,0,.15)}
.wrap{position:absolute;inset:0;padding:14mm 14mm 12mm;display:flex;flex-direction:column}
.brand{display:flex;justify-content:space-between;align-items:center;font-family:'Bebas Neue',Anton,sans-serif;font-size:7mm;letter-spacing:1mm;opacity:.95}
.badge{display:inline-block;padding:1.2mm 5mm;border-radius:999px;font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:4.6mm;letter-spacing:.3mm;background:#ff2fd0;color:#fff;transform:rotate(-3deg)}
h1{margin:10mm 0 0;font-size:33mm;line-height:.98;font-weight:900;word-break:keep-all;position:relative}
h1 .a{display:block;color:#ffe14d;font-family:Anton,'Black Han Sans','Noto Sans KR',sans-serif;text-transform:uppercase;}h1 .b{display:block;color:#fff;font-family:Anton,'Black Han Sans','Noto Sans KR',sans-serif;text-transform:uppercase;}
.sub{margin:6mm 0 0;font-size:7.2mm;font-weight:700;color:#fff;letter-spacing:.2mm}
.hero{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:60mm}
.hero img{max-height:118mm;max-width:80%;filter:drop-shadow(0 8mm 10mm rgba(0,0,0,.35))}
.hero .big{font-family:Anton,'Black Han Sans',sans-serif;font-size:54mm;line-height:1;color:transparent;-webkit-text-stroke:.6mm #fff;opacity:.35;letter-spacing:2mm}
.foot{position:relative}
.kr{font-size:6.4mm;font-weight:700;color:#fff}
.zh{font-family:'Noto Sans SC','Noto Sans KR',sans-serif;font-size:7.4mm;font-weight:900;color:#1a0a4a;margin-top:1mm}
.ban{margin-top:5mm;padding:2.6mm 5mm;font-family:'Bebas Neue',Anton,sans-serif;font-size:5.6mm;letter-spacing:.8mm;background:#1a0a4a;color:#ffe14d;display:flex;justify-content:space-between}
.law{margin-top:2.5mm;font-size:3.2mm;opacity:.75;color:#1a0a4a}
@media print{html,body{background:#fff}}</style></head><body>
<div class="pop"><div class="half" style="background:#ffe14d"></div><svg class="squig" style="left:6mm;top:8mm" width="90" height="60" viewBox="0 0 90 60"><path d="M4 40 C20 0,30 60,46 20 S72 40,86 8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg><svg class="squig" style="right:8mm;top:52%" width="70" height="60" viewBox="0 0 70 60"><path d="M6 10 C40 -6,64 30,30 40 S60 62,66 30" fill="none" stroke="#ff2fd0" stroke-width="5" stroke-linecap="round"/></svg><div class="star" style="left:80%;top:9%;color:#fff">✱</div><div class="star" style="left:6%;top:56%;color:#fff">✱</div>
<div class="wrap">
  <div class="brand"><span>WEVAPE</span><span class="badge">직영매장</span></div>

  <div class="hero"><div class="big">WEVAPE</div></div>
  <div class="foot">
    <div class="kr">본사가 직접 운영 상담 가능</div>
    <div class="zh">直营店·库存充足</div>
    <div class="ban"><span>위베이프 검단점</span><span>0507-1377-4537</span></div>
    <div class="law">인천광역시 서구 원당대로 983 1층 104호 · 본 매장은 성인만 이용할 수 있습니다. 담배는 건강에 해롭습니다.</div>
  </div>
</div></div></body></html>
