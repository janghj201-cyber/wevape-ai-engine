<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>[연수] 매장 안내 POP</title>
<style>@page{size:A4 portrait;margin:0}html,body{margin:0;background:#e5e7eb}
.pop{width:210mm;height:297mm;margin:0 auto;background:#FFFFFF;color:#1A1A1A;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;padding:16mm 14mm;position:relative;overflow:hidden}

li{margin:0 0 6mm;padding-left:10mm;position:relative;word-break:keep-all}
li:before{content:"";position:absolute;left:0;top:3.5mm;width:5.5mm;height:5.5mm;border-radius:50%;background:#0066CC}
.foot{position:relative;border-top:.6mm solid #0066CC;padding-top:5mm;font-size:4.6mm;line-height:1.5;opacity:.95}
.foot b{font-size:5.4mm}
.law{position:relative;font-size:3.6mm;opacity:.75;margin-top:3mm;line-height:1.4}
.zh{font-size:4.2mm;opacity:.85;margin-top:1mm}
